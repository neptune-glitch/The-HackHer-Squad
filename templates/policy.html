<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigShield - Policy Plans</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-md mx-auto p-4">

  <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Choose Your Plan</h1>

  <!-- Basic Plan -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4">
    <h2 class="text-lg font-semibold">Basic Plan</h2>
    <p class="text-gray-500 mb-2">₹25/week</p>
    <ul class="text-sm mb-3">
      <li>✔ ₹300 per claim</li>
      <li>✔ Covers pollution & rain</li>
    </ul>
    <button class="w-full bg-blue-500 text-white py-2 rounded-xl">Select</button>
  </div>

  <!-- Standard Plan -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4 border-2 border-blue-500">
    <h2 class="text-lg font-semibold">Standard Plan ⭐</h2>
    <p class="text-gray-500 mb-2">₹40/week</p>
    <ul class="text-sm mb-3">
      <li>✔ ₹500 per claim</li>
      <li>✔ Covers all disruptions</li>
    </ul>
    <button class="w-full bg-blue-600 text-white py-2 rounded-xl">Select</button>
  </div>

  <!-- Premium Plan -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4">
    <h2 class="text-lg font-semibold">Premium Plan</h2>
    <p class="text-gray-500 mb-2">₹60/week</p>
    <ul class="text-sm mb-3">
      <li>✔ ₹800 per claim</li>
      <li>✔ Priority payouts</li>
    </ul>
    <button class="w-full bg-blue-500 text-white py-2 rounded-xl">Select</button>
  </div>

</div>

</body>
</html>
