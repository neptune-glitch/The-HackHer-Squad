<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Helix</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: min(420px, calc(100vw - 32px));
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 16px;
      padding: 28px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      color: #67e8f9;
    }

    p {
      margin: 0 0 16px;
      color: #cbd5e1;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #06b6d4;
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      margin-top: 12px;
      color: #fca5a5;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Admin Access</h1>
    <p>Sign in with your admin credentials to view the platform dashboard.</p>

    <form method="POST" action="/admin/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <button type="submit">Login</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
