<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigShield - Financial Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-md mx-auto p-4">

  <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Financial Overview</h1>

  <!-- Earnings -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4">
    <h2 class="font-semibold text-lg">This Month</h2>
    <p class="text-gray-600">Delivery Earnings</p>
    <p class="text-xl font-bold">₹18,000</p>
  </div>

  <!-- Loss Prevented -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4">
    <h2 class="font-semibold text-lg">Loss Prevented</h2>
    <p class="text-green-600 text-xl font-bold">₹3,000 Saved</p>
  </div>

  <!-- Premium Paid -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4">
    <h2 class="font-semibold text-lg">Premium Paid</h2>
    <p class="text-gray-600">₹160 this month</p>
  </div>

  <!-- Net Benefit -->
  <div class="bg-white rounded-2xl shadow p-4">
    <h2 class="font-semibold text-lg">Net Benefit</h2>
    <p class="text-blue-600 text-xl font-bold">+₹2,840</p>
  </div>

</div>

</body>
</html>
