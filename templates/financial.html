<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helix - Financial Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
    }
  </style>
</head>

<body>

<div class="max-w-md mx-auto p-4 pt-8">

  <h1 class="text-2xl font-bold text-center text-cyan-400 mb-6">💰 Financial Model</h1>

  <!-- Total Workers -->
  <div class="bg-white bg-opacity-10 backdrop-blur rounded-2xl shadow p-4 mb-4 text-white">
    <h2 class="font-semibold text-lg text-cyan-300">Total Workers Enrolled</h2>
    <p class="text-3xl font-bold">{{ total_workers }}</p>
  </div>

  <!-- Weekly Premium -->
  <div class="bg-white bg-opacity-10 backdrop-blur rounded-2xl shadow p-4 mb-4 text-white">
    <h2 class="font-semibold text-lg text-cyan-300">Weekly Premium Collected</h2>
    <p class="text-3xl font-bold text-green-400">₹{{ weekly_premium }}</p>
  </div>

  <!-- Expected Claims -->
  <div class="bg-white bg-opacity-10 backdrop-blur rounded-2xl shadow p-4 mb-4 text-white">
    <h2 class="font-semibold text-lg text-cyan-300">Expected Claims / Week</h2>
    <p class="text-3xl font-bold">{{ expected_claims }}</p>
  </div>

  <!-- Total Payouts -->
  <div class="bg-white bg-opacity-10 backdrop-blur rounded-2xl shadow p-4 mb-4 text-white">
    <h2 class="font-semibold text-lg text-cyan-300">Total Payouts / Week</h2>
    <p class="text-3xl font-bold text-red-400">₹{{ total_payouts }}</p>
  </div>

  <!-- Weekly Profit -->
  <div class="bg-white bg-opacity-10 backdrop-blur rounded-2xl shadow p-4 mb-4 text-white">
    <h2 class="font-semibold text-lg text-cyan-300">Weekly Profit</h2>
    <p class="text-3xl font-bold text-green-400">₹{{ profit }}</p>
  </div>

  <!-- Back Button -->
  <a href="/dashboard" class="block text-center bg-cyan-500 hover:bg-cyan-600 text-white py-2 rounded-xl mt-4">
    ← Back to Dashboard
  </a>

</div>

</body>
</html>
