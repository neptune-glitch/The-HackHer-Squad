<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigShield - Claims</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-md mx-auto p-4">

  <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Claims Dashboard</h1>

  <!-- Active Status -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4">
    <p class="text-gray-600">Policy Status</p>
    <p class="text-green-600 font-bold text-lg">Active ✅</p>
  </div>

  <!-- Latest Claim -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4">
    <h2 class="font-semibold text-lg mb-2">Latest Claim</h2>
    <p><strong>Reason:</strong> AQI above 400</p>
    <p><strong>Zone:</strong> Alpha</p>
    <p><strong>Time:</strong> 7:05 AM</p>
    <p class="text-green-600 font-bold mt-2">₹500 Credited</p>
  </div>

  <!-- Claim History -->
  <div class="bg-white rounded-2xl shadow p-4">
    <h2 class="font-semibold text-lg mb-3">Claim History</h2>

    <div class="border-b py-2">
      <p class="font-medium">Heavy Rain</p>
      <p class="text-sm text-gray-500">₹500 • 22 March</p>
    </div>

    <div class="border-b py-2">
      <p class="font-medium">Extreme Heat</p>
      <p class="text-sm text-gray-500">₹500 • 15 March</p>
    </div>

    <div class="py-2">
      <p class="font-medium">Severe Pollution</p>
      <p class="text-sm text-gray-500">₹500 • 10 March</p>
    </div>

  </div>

</div>

</body>
</html>
