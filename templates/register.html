<!DOCTYPE html>
<html>
<head>
    <title>Register - GigShield</title>
    <link rel="stylesheet" href="/static/registerstyle.css">
</head>
<body>

<div class="account">
    <h1>🛡️ GigShield</h1>
    <p class="subtitle">Create your account to get protected</p>

    <form method="POST" action="/register">
        
        <div class="input-group">
            <input type="text" name="name" required>
            <label>Full Name</label>
        </div>

        <div class="input-group">
            <input type="text" name="phone" required>
            <label>Phone Number</label>
        </div>

        <div class="select-group">
            <select name="zone" required>
                <option value="">Select Your City/Zone</option>
                <optgroup label="🏙️ Delhi">
                    <option value="Dwarka, Delhi">Dwarka</option>
                    <option value="Lajpat Nagar, Delhi">Lajpat Nagar</option>
                    <option value="Rohini, Delhi">Rohini</option>
                    <option value="Connaught Place, Delhi">Connaught Place</option>
                </optgroup>
                <optgroup label="🌆 Other Cities">
                    <option value="Mumbai">Mumbai</option>
                    <option value="Bangalore">Bangalore</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Kolkata">Kolkata</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Pune">Pune</option>
                    <option value="Ahmedabad">Ahmedabad</option>
                    <option value="Jaipur">Jaipur</option>
                    <option value="Lucknow">Lucknow</option>
                    <option value="Noida">Noida</option>
                </optgroup>
            </select>
        </div>

        <div class="input-group">
            <input type="text" name="upi" required>
            <label>UPI ID</label>
        </div>

        <div class="select-group">
            <select name="platform" required>
                <option value="">Select Platform</option>
                <option value="Amazon">Amazon</option>
                <option value="Flipkart">Flipkart</option>
            </select>
        </div>

        <div class="select-group">
            <select name="plan" required>
                <option value="">Select Plan</option>
                <option value="Basic - ₹25/week">Basic - ₹25/week</option>
                <option value="Standard - ₹40/week">Standard - ₹40/week</option>
                <option value="Premium - ₹60/week">Premium - ₹60/week</option>
            </select>
        </div>

        <div class="input-group">
            <input type="password" name="password" required>
            <label>Password</label>
        </div>

        <button type="submit" class="btn">Register Now</button>

    </form>

    <p class="login-link">
        Already registered? <a href="/login">Login here</a>
    </p>
</div>

</body>
</html>
